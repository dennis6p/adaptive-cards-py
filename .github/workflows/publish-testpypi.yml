name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "PR Validation run ID containing the build-artifacts artifact"
        required: true
        type: string

permissions:
  actions: read

jobs:
  publish:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest

    environment:
      name: test
      url: https://test.pypi.org/project/adaptive-cards-py/

    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download PR artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts
          path: dist/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Show distributions
        run: |
          ls -lah dist/

      - name: Validate distribution files
        run: |
          shopt -s nullglob

          files=(dist/*.whl dist/*.tar.gz)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python distributions found"
            exit 1
          fi

          echo "Distributions to publish:"
          printf '%s\n' "${files[@]}"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/